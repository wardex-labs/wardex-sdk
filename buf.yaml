version: v2
modules:
  - path: proto
lint:
  use:
    - BASIC
breaking:
  use:
    - FILE
  # No `ignore_only` entries on purpose. An exception here is scoped to a whole
  # file, not to one field, so one that outlives the change it was written for
  # silently lets every later deletion in that file through. A deliberate break
  # adds its entry in the same change and the very next change removes it (the
  # baseline already contains the break by then, so nothing needs excusing).
  # `scripts/check-buf-exceptions.sh` enforces the second half in CI.
