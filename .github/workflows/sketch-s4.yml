name: sketch-s4

# A measurement sketch, not a gate: combinations, neighbouring instrumentation
# and development branches, run through the real point executor where it can.
# Runs only on pushes to its own branch and writes nothing.

on:
  push:
    branches: ["compat-rehearsal-s4"]

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: plan
        run: |
          mkdir -p plan
          python3 sketch/s4_plan.py plan/plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compat-plan
          path: plan

  wheel:
    name: build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --locked --out dist
          target: x86_64
          manylinux: auto
          working-directory: sdks/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compat-wheel
          path: sdks/python/dist

  point:
    name: ${{ matrix.key }}
    needs: [plan, wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.12.23"
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compat-plan
          path: plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compat-wheel
          path: dist
      - name: run the point
        env:
          KEY: ${{ matrix.key }}
        run: |
          python3 scripts/compat/point.py --plan plan/plan.json --key "$KEY" \
            --wheel-dir dist --work "$RUNNER_TEMP/point" --out out
          python3 - <<'PY'
          import json
          r = json.load(open("out/result.json"))
          t = r.get("tests") or {}
          print("RESULT", r["key"], r["outcome"], r.get("install"), {k: t.get(k) for k in ("passed", "failed", "errors", "skipped", "seconds")})
          print("FAILED", t.get("failed_ids"))
          print("EXCLUDED", t.get("excluded_files"))
          print("TARGETS", {d: r["resolved"].get(d) for d in r["targets"]})
          print("ATTACH", r.get("attach"))
          import os
          if os.path.exists("out/neighbour.json"): print("NEIGHBOUR", open("out/neighbour.json").read())
          print("FILES", t.get("files"))
          for d in ("httpx", "httpcore", "h11", "h2", "aiohttp", "requests", "urllib3", "anyio", "uvloop"):
              if d in r["resolved"]: print("WITH", d, r["resolved"][d])
          PY
      - name: which anyio the three TLS tests fail on
        if: matrix.key == 'transport--httpx--floor'
        run: |
          V="$RUNNER_TEMP/point/venv/bin/python"
          T="sdks/python/tests/test_ssl_interceptor.py"
          K="anyio_tls_reads_the_peer or async_capture_populates_handshake or async_https_call_is_captured"
          echo "::group::the three alone, as installed"
          "$V" -m pytest "$T" -q -k "$K" --tb=short -p no:cacheprovider || true
          echo "::endgroup::"
          for A in 4.6.2 4.7.0 4.8.0 4.9.0; do
            uv pip install --python "$V" --quiet "anyio==$A"
            echo "ANYIO $A: three alone"
            "$V" -m pytest "$T" -q -k "$K" --tb=line -p no:cacheprovider 2>&1 | tail -6 || true
            echo "ANYIO $A: the whole file"
            "$V" -m pytest "$T" -q --tb=line -p no:cacheprovider 2>&1 | tail -6 || true
          done
          uv pip install --python "$V" --quiet "anyio==4.7.0"
          echo "::group::first failure in full, anyio 4.7.0"
          "$V" -m pytest "$T" -q -k "async_https_call_is_captured" --tb=long -p no:cacheprovider 2>&1 | head -150 || true
          echo "::endgroup::"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compat-point-${{ matrix.key }}
          path: out
          if-no-files-found: ignore

