name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `buf breaking` resolves its baseline out of the local `.git`, and a
          # depth-limited clone simply does not contain it — the step would then
          # fail on every run, which is indistinguishable from a real break and
          # gets muted. Full history rather than `fetch-depth: 2` because the
          # baseline is the state the branch had BEFORE this push, which can be
          # any number of commits back (see the `buf breaking` step).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # setup_only: install buf, run nothing. The action's own defaults enable
      # lint/format/breaking ONLY on pull_request, and this repo's history is
      # almost entirely direct pushes to main — so a schema break's most likely
      # path was also the one path with no check on it. The defaults would also
      # turn on `buf format --exit-code`, which the current tree does not pass
      # (all five protos re-format); reformatting them is a separate commit, not
      # this one. Explicit steps below, so what runs is visible here.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (workspace; includes proto roundtrip)
        run: cargo test --workspace
      - name: PII perf guard (release)
        run: cargo test -p wardex-pipeline --release --test pii_perf -- --ignored
      - name: buf lint
        run: buf lint
      # `buf.yaml` has declared `breaking: use: [FILE]` all along with nothing
      # running it. This is what makes an unintended `wardex.v1` change fail the
      # build — and therefore what makes a deliberate one a decision, since
      # landing it requires an explicit `ignore_only` entry in `buf.yaml` in the
      # same commit, rather than an accident nobody notices.
      #
      # The baseline is the state the branch had BEFORE this event, NOT `HEAD~1`.
      # `HEAD~1` is correct only when the event carries exactly one commit: for a
      # push of A..B it compares B against A, so a break introduced in A is
      # already present in the baseline and passes green (measured). `main` here
      # takes work by fast-forward as the rule and by merge commit only as the
      # exception, so a push carrying several commits is the normal case rather
      # than the edge one, and that is exactly the path this step exists to
      # cover. Measured 2026-09-13: 4 of the last 108 commits on `main` were
      # merges, counted by parents per commit —
      #   git log -108 --pretty='%p' | awk '{if(NF>1)c++} END{print c+0}'
      # (`git log --merges -108` is the wrong instrument: it filters before the
      # cap, so it counts merges across all of history instead of this window.)
      #
      # `github.event.before` is the pre-push tip; `pull_request.base.sha` is the
      # base branch tip. GitHub sends an all-zero `before` for a branch's first
      # push, which has no baseline to compare against.
      - name: buf breaking (against the state before this push / PR)
        env:
          BUF_BREAKING_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BUF_BREAKING_BASE" ] || \
             [ "$BUF_BREAKING_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no baseline for this event (first push of a branch); nothing to compare against"
            exit 0
          fi
          buf breaking --against ".git#format=git,ref=$BUF_BREAKING_BASE"

      # The quality budgets, printed into the run log so anyone reading a public
      # CI run can recover the numbers behind the claims in README.md without a
      # checkout. The step decides nothing, and `if: always()` plus
      # `continue-on-error` are deliberate: it reports even after a gate above
      # has failed, and it can never itself turn a build red. What ENFORCES the
      # budgets is `sdks/python/tests/test_quality_ratchets.py`, collected by
      # the pytest step in the job below; this step only records them.
      - name: quality snapshot (recorded, never gating)
        if: always()
        continue-on-error: true
        run: bash scripts/quality-snapshot.sh

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # uv.lock is gitignored (library convention); key the cache on pyproject instead.
          cache-dependency-glob: "**/pyproject.toml"
      - name: uv sync (builds wardex_sdk via maturin)
        run: uv sync --python ${{ matrix.python-version }}
      - name: ruff check
        run: uv run ruff check sdks/python examples
      - name: ruff format --check
        run: uv run ruff format --check sdks/python examples
      - name: pytest
        run: uv run pytest sdks/python/tests -v
