name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: run clippy on the current stable and beta (non-blocking) and make
    # the advisory check blocking, so a toolchain bump or a new advisory is
    # foreseen on a quiet Monday instead of discovered on someone's PR.
    - cron: "0 6 * * 1"

# The workflow needs nothing beyond reading the checkout. The repository
# default is already `read`; stating it here keeps the file from depending on
# a setting a maintainer can flip.
permissions:
  contents: read

# A force-push to a PR branch cancels that branch's running jobs instead of
# finishing stale ones. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the tag is in the comment): a tag can be
# moved, and `release-python.yml` runs with PyPI publish rights. Dependabot
# keeps the SHAs current.

jobs:
  # The Rust gate is `scripts/check-rust.sh`; AGENTS.md and the release
  # workflow run the same script, so the three cannot drift.
  rust-lint:
    name: rust lint (fmt, clippy, rustdoc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: scripts/check-rust.sh lint

  rust-test:
    name: rust test (workspace, PII perf guard)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: scripts/check-rust.sh test

  # `rust-version` in Cargo.toml is the oldest compiler this workspace is
  # checked with, not a guess; this job is what makes that sentence true.
  rust-msrv:
    name: rust msrv (cargo check on the declared floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/check-rust.sh msrv

  # The wheel statically links every dependency into an artifact shipped to
  # customers, so each dependency's license and source is checked before it can
  # ship, and dependencies no code uses are removed.
  rust-deps:
    name: rust deps (cargo-deny, cargo-machete)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - run: scripts/check-rust.sh deps
        env:
          # Advisory data changes independently of the code, so a new entry
          # fails only the scheduled run, never an unrelated pull request.
          CHECK_RUST_ADVISORIES_BLOCKING: ${{ github.event_name == 'schedule' && '1' || '0' }}

  # Early warning for the next toolchain bump: the lints the current stable
  # and beta would add to the pinned toolchain's set. It runs only on the
  # schedule, so a failure blocks no change; it reaches the maintainer as a
  # failed scheduled run, which a job-level continue-on-error would hide.
  lint-next:
    name: clippy on ${{ matrix.toolchain }} (next toolchain)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy
      - run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --all-features --locked -- -D warnings

  proto:
    name: proto (buf lint, breaking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # `buf breaking` resolves its baseline out of the local `.git`, and a
          # depth-limited clone simply does not contain it — the step would then
          # fail on every run, which is indistinguishable from a real break and
          # gets muted. Full history rather than `fetch-depth: 2` because the
          # baseline is the state the branch had BEFORE this push, which can be
          # any number of commits back (see the `buf breaking` step).
          fetch-depth: 0
      # setup_only: install buf, run nothing. The action's own defaults enable
      # lint/format/breaking ONLY on pull_request, and this repo's history is
      # almost entirely direct pushes to main — so a schema break's most likely
      # path was also the one path with no check on it. The defaults would also
      # turn on `buf format --exit-code`, which the current tree does not pass
      # (all five protos re-format); reformatting them is a separate commit, not
      # this one. Explicit steps below, so what runs is visible here.
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      # `buf.yaml` has declared `breaking: use: [FILE]` all along with nothing
      # running it. This is what makes an unintended `wardex.v1` change fail the
      # build — and therefore what makes a deliberate one a decision, since
      # landing it requires an explicit `ignore_only` entry in `buf.yaml` in the
      # same commit, rather than an accident nobody notices.
      #
      # That entry comes out again in the first change after the break lands.
      # `ignore_only` excuses a whole file, not one field, and once the baseline
      # contains the break there is nothing left to excuse: an entry left behind
      # only switches this step off for every later deletion in that file
      # (with a stale entry, deleting any `envelope.proto` field exits 0;
      # without it, the same deletion exits 100).
      #
      # The baseline is the state the branch had BEFORE this event, NOT `HEAD~1`.
      # `HEAD~1` is correct only when the event carries exactly one commit: for a
      # push of A..B it compares B against A, so a break introduced in A is
      # already present in the baseline and passes green. `main` here takes work
      # by fast-forward as the rule and by merge commit only as the exception,
      # so a push carrying several commits is the normal case rather than the
      # edge one, and that is exactly the path this step exists to cover.
      #
      # `github.event.before` is the pre-push tip; `pull_request.base.sha` is the
      # base branch tip. GitHub sends an all-zero `before` for a branch's first
      # push, which has no baseline to compare against.
      - name: buf breaking (against the state before this push / PR)
        env:
          BUF_BREAKING_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BUF_BREAKING_BASE" ] || \
             [ "$BUF_BREAKING_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no baseline for this event (first push of a branch); nothing to compare against"
            exit 0
          fi
          buf breaking --against ".git#format=git,ref=$BUF_BREAKING_BASE"
      # The step above cannot see an exception that stayed in `buf.yaml` after
      # its break landed: a stale entry makes it pass, which is the whole
      # problem. This one runs the same comparison with the exceptions stripped
      # and fails if that still passes, so "the entry comes out in the next
      # change" is enforced by the next change's own CI run, not by a reader
      # remembering the comment.
      - name: buf breaking exceptions are not stale
        env:
          BUF_BREAKING_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BUF_BREAKING_BASE" ] || \
             [ "$BUF_BREAKING_BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no baseline for this event (first push of a branch); nothing to compare against"
            exit 0
          fi
          scripts/check-buf-exceptions.sh ".git#format=git,ref=$BUF_BREAKING_BASE"

  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
          # uv.lock is gitignored (library convention); key the cache on pyproject instead.
          cache-dependency-glob: "**/pyproject.toml"
      - name: uv sync (builds wardex_sdk via maturin)
        run: uv sync --python ${{ matrix.python-version }}
      - name: ruff check
        run: uv run ruff check sdks/python examples
      - name: ruff format --check
        run: uv run ruff format --check sdks/python examples
      - name: pytest
        run: uv run pytest sdks/python/tests -v
      # The openai-agents test pin resolves to the newest tested minor. The oldest
      # tested minor lists an agent's tools in a different place, so its tree is
      # different, and claiming it as tested means running it: the same tests
      # again on it. `test_adapter_status.py` holds this version to the lowest
      # minor in the adapters' table of tested versions.
      - name: pytest (openai-agents adapter, oldest tested minor)
        run: |
          uv run --with 'openai-agents==0.22.3' python -c "import importlib.metadata as m; v = m.version('openai-agents'); print('openai-agents', v); assert v == '0.22.3', v"
          uv run --with 'openai-agents==0.22.3' pytest -v sdks/python/tests/test_openai_agents_adapter.py sdks/python/tests/test_openai_agents_conformance.py sdks/python/tests/test_openai_agents_wire.py
      # The quality budgets, printed into the run log so anyone reading a public
      # CI run can recover the numbers without a checkout. The step decides
      # nothing, and `if: always()` plus `continue-on-error` are deliberate: it
      # reports even after a gate above has failed, and it can never itself turn
      # a build red. What ENFORCES the budgets is
      # `sdks/python/tests/test_quality_ratchets.py`, collected by the pytest
      # step above; this step only records them.
      - name: quality snapshot (recorded, never gating)
        if: always() && matrix.python-version == '3.12'
        continue-on-error: true
        run: bash scripts/quality-snapshot.sh
