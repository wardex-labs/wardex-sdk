name: release-python

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    name: build wheels (${{ matrix.platform.target }} on ${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}
    # Fail fast if a runner label has no capacity, instead of hanging up to the
    # 24h "awaiting a runner" ceiling and silently skipping publish (needs: build).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64,  manylinux: auto }
          - { runner: ubuntu-latest,  target: aarch64, manylinux: auto }
          # Intel macOS wheel is cross-compiled on an Apple Silicon runner —
          # the macos-13 Intel hosted runner is retired / capacity-starved.
          - { runner: macos-14,       target: x86_64,  manylinux: "" }
          - { runner: macos-14,       target: aarch64, manylinux: "" }
          - { runner: windows-latest, target: x64,     manylinux: "" }
    steps:
      - uses: actions/checkout@v4
      # Run maturin from the package dir so it reads sdks/python/pyproject.toml
      # (which points at the real crate via [tool.maturin] manifest-path). maturin's
      # own --manifest-path expects a Cargo.toml, not pyproject.toml.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: sdks/python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: sdks/python/dist

  smoke:
    name: smoke-test wheel (linux x86_64)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest-x86_64
          path: dist
      # Import the built wheel (--no-index so it can't silently fall back to PyPI)
      # to catch a broken native extension or missing files before we publish.
      - name: install and import the built wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre --no-index --find-links dist wardex-sdk
          python -c "import wardex_sdk; print('smoke ok:', wardex_sdk.__version__)"

  publish:
    name: publish to PyPI
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
