name: release-python

on:
  push:
    tags:
      - "python-v*"
  # Build and smoke on demand. A tag push is irreversible, so every path below
  # it — Rosetta, an Intel interpreter on an arm64 runner, the QEMU container,
  # the Windows shell — has to be provable before the tag exists rather than
  # discovered by it. `publish` requires this trigger to be absent, so a
  # dispatch runs the whole gate and stops short of PyPI on any ref.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build wheels (${{ matrix.platform.target }} on ${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}
    # Fail fast if a runner label has no capacity, instead of hanging up to the
    # 24h "awaiting a runner" ceiling and silently skipping publish (needs: build).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64,  manylinux: auto }
          - { runner: ubuntu-latest,  target: aarch64, manylinux: auto }
          # Intel macOS wheel is cross-compiled on an Apple Silicon runner —
          # the macos-13 Intel hosted runner is retired / capacity-starved.
          - { runner: macos-14,       target: x86_64,  manylinux: "" }
          - { runner: macos-14,       target: aarch64, manylinux: "" }
          - { runner: windows-latest, target: x64,     manylinux: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run maturin from the package dir so it reads sdks/python/pyproject.toml
      # (which points at the real crate via [tool.maturin] manifest-path). maturin's
      # own --manifest-path expects a Cargo.toml, not pyproject.toml.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --locked --out dist
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: sdks/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: sdks/python/dist

  smoke:
    name: smoke-test wheel (${{ matrix.platform.target }} on ${{ matrix.platform.runner }}, py${{ matrix.platform.python }})
    needs: [build]
    runs-on: ${{ matrix.platform.runner }}
    # QEMU emulation of an arm64 install is minutes, not seconds; cap it rather
    # than let a hung emulator hold the publish gate open.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Covers the same axis as `build`: every wheel that job produces is
        # installed and imported by at least one entry here. A wheel building
        # is not a wheel installing — an abi3 tag, a missing bundled library or
        # a bad cross-compile only show up at import time. If an entry ever
        # becomes untestable it gets an `exclude` with a reason, never a silent
        # deletion; there are none today.
        #
        # `how` selects the interpreter the wheel is loaded into:
        #   native  — the runner's own architecture matches the wheel
        #   rosetta — Intel interpreter on the Apple Silicon runner (the Intel
        #             wheel is cross-compiled there, so nothing native can load it)
        #   qemu    — arm64 container on the x86_64 Linux runner
        #
        # `python` is per-entry rather than a literal because the wheels are
        # abi3-py310: which interpreter actually loaded them is the result, so
        # it belongs in the job name and in one place per entry.
        #
        # The abi3 tag is also the one failure named above that a single
        # interpreter cannot see, which is why the linux x86_64 wheel gets a
        # second entry on 3.10 — the floor `requires-python` promises. A wheel
        # tagged `cp312-cp312` (abi3 dropped) or `cp311-abi3` (pyo3's
        # `abi3-py310` feature bumped without the manifest) installs and imports
        # perfectly on 3.12 while being unavailable to every user on the floor;
        # only a floor entry goes red. x86_64 Linux carries it because that
        # runner has every version, and it is the cheapest of the six.
        platform:
          - { runner: ubuntu-latest,  target: x86_64,  how: native,  python: "3.12" }
          - { runner: ubuntu-latest,  target: x86_64,  how: native,  python: "3.10" }
          - { runner: ubuntu-latest,  target: aarch64, how: qemu,    python: "3.12" }
          - { runner: macos-14,       target: x86_64,  how: rosetta, python: "3.12" }
          - { runner: macos-14,       target: aarch64, how: native,  python: "3.12" }
          - { runner: windows-latest, target: x64,     how: native,  python: "3.12" }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

      # `arch -x86_64` on a universal system binary is the cheapest probe for
      # "is Rosetta here"; the install is a no-op reboot-free download when it
      # is not, and images have flipped on this before. `sudo` because
      # `--install-rosetta` installs a system component and refuses to run as
      # the unprivileged `runner` user — without it the fallback can only fail,
      # and it fails in exactly the case it exists for.
      - name: ensure Rosetta 2
        if: matrix.platform.how == 'rosetta'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.platform.how != 'qemu'
        with:
          python-version: ${{ matrix.platform.python }}
          # Empty means "the runner's architecture" (setup-python falls back to
          # os.arch()), so only the Rosetta entry asks for an Intel build.
          architecture: ${{ matrix.platform.how == 'rosetta' && 'x64' || '' }}

      # Import the built wheel (--no-index so it can't silently fall back to PyPI)
      # to catch a broken native extension or missing files before we publish.
      # The last line proves the wheel was built without the test-only fault
      # injection: `_panic_for_test` exists only to make the SDK fail, and the
      # development build is the only one that may carry it (the feature's name
      # is deliberately absent from this file; a test asserts that).
      - name: install and import the built wheel
        if: matrix.platform.how == 'native'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre --no-index --find-links dist wardex-sdk
          python -c "import wardex_sdk; print('smoke ok:', wardex_sdk.__version__)"
          python -c "import wardex_sdk._wardex_native as n; assert not hasattr(n, '_panic_for_test'), 'release wheel carries the test-only fault-injection entry point'"

      # Selecting the x64 interpreter is not enough on the arm64 runner: a bare
      # `python` has resolved to the system framework build (native arm64), and
      # an arm64 pip rejects the Intel wheel outright ("versions: none"). So
      # call the interpreter setup-python reports, force it through Rosetta
      # with `arch -x86_64`, and assert the architecture before trusting any
      # green that follows.
      - name: install and import the built wheel (Rosetta)
        if: matrix.platform.how == 'rosetta'
        shell: bash
        run: |
          py="$pythonLocation/bin/python"
          arch -x86_64 "$py" -c 'import platform; m = platform.machine(); assert m == "x86_64", m'
          arch -x86_64 "$py" -m pip install --upgrade pip
          arch -x86_64 "$py" -m pip install --pre --no-index --find-links dist wardex-sdk
          arch -x86_64 "$py" -c "import wardex_sdk; print('smoke ok:', wardex_sdk.__version__)"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform.how == 'qemu'
        with:
          platforms: arm64

      # Same three commands as above, run inside an arm64 container. Written to
      # a file rather than passed to `bash -c` so the quoting survives two
      # levels of shell.
      - name: install and import the built wheel (arm64 container)
        if: matrix.platform.how == 'qemu'
        run: |
          cat > smoke.sh <<'SH'
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --pre --no-index --find-links /dist wardex-sdk
          python -c "import wardex_sdk; print('smoke ok:', wardex_sdk.__version__)"
          SH
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist:/dist:ro" -v "$PWD/smoke.sh:/smoke.sh:ro" \
            python:${{ matrix.platform.python }}-slim bash /smoke.sh

  # The Rust gate `ci.yml` runs, re-run on the exact commit the tag points at,
  # through the same script (`scripts/check-rust.sh`), so a check added to CI is
  # a check the release runs too. Without it, a tag on a commit whose CI was red
  # would publish just the same: `smoke` only proves the wheel imports, not that
  # the code in it is right.
  #
  # Two interpreters, not the five `ci.yml` covers: the floor `requires-python`
  # promises (the one that catches a 3.11+-only API, which the newest
  # interpreter never does) and the newest, in parallel.
  gate:
    name: gate (rust lint+test, ruff, pytest on py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - run: scripts/check-rust.sh lint test deps msrv
        env:
          # The wheel statically links this exact dependency graph, so here a
          # known advisory or a yanked crate blocks the publish; on a pull
          # request the same step only reports (see ci.yml).
          CHECK_RUST_ADVISORIES_BLOCKING: "1"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: uv sync (builds wardex_sdk via maturin)
        run: uv sync --python ${{ matrix.python-version }}
      - name: ruff check
        run: uv run ruff check sdks/python examples
      - name: ruff format --check
        run: uv run ruff format --check sdks/python examples
      - name: pytest
        run: uv run pytest sdks/python/tests -q

  publish:
    name: publish to PyPI
    needs: [build, smoke, gate]
    # Only a *pushed* `python-v*` tag publishes. The trigger is half the guard
    # because workflow_dispatch takes a tag ref too — the ref picker has a Tag
    # tab, and `gh workflow run --ref python-v1.2.3` is the obvious way to
    # re-run the gate after a flaky smoke entry. On the ref alone that rerun
    # would walk into the one action nothing can undo.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist
