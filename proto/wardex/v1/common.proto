syntax = "proto3";
package wardex.v1;

option java_package = "io.wardex.proto.v1";
option java_multiple_files = true;

// --- Enums ---

enum SpanKind {
  SPAN_KIND_UNSPECIFIED = 0;
  SPAN_KIND_INTERNAL = 1;
  SPAN_KIND_CLIENT = 2;
  SPAN_KIND_SERVER = 3;
}

enum StatusCode {
  STATUS_CODE_UNSET = 0;
  STATUS_CODE_OK = 1;
  STATUS_CODE_ERROR = 2;
}

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_HTTP = 1;
  PROTOCOL_GRPC = 2;
  PROTOCOL_WEBSOCKET = 3;
  PROTOCOL_MCP_STDIO = 4;
  PROTOCOL_SSE = 5;
}

enum Modality {
  MODALITY_UNSPECIFIED = 0;
  MODALITY_TEXT = 1;
  MODALITY_IMAGE = 2;
  MODALITY_AUDIO = 3;
  MODALITY_VIDEO = 4;
  MODALITY_EMBEDDING = 5;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_OUTBOUND = 1;
  DIRECTION_INBOUND = 2;
}

enum SnapshotType {
  SNAPSHOT_TYPE_UNSPECIFIED = 0;
  SNAPSHOT_TYPE_SPAN_START = 1;
  SNAPSHOT_TYPE_SPAN_END = 2;
  SNAPSHOT_TYPE_TURN_START = 3;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_ACTIVE = 1;
  SESSION_STATUS_COMPLETED = 2;
  SESSION_STATUS_INTERRUPTED = 3;
  SESSION_STATUS_CRASHED = 4;
}

enum CaptureSource {
  CAPTURE_SOURCE_UNSPECIFIED = 0;
  CAPTURE_SOURCE_ADAPTER = 1;
  CAPTURE_SOURCE_SSL = 2;
  CAPTURE_SOURCE_STDIO = 3;
  CAPTURE_SOURCE_GRPC = 4;
  CAPTURE_SOURCE_WEBSOCKET = 5;
  CAPTURE_SOURCE_MANUAL = 6;
  CAPTURE_SOURCE_SOCKET = 7;  // plaintext raw-socket seam (http/ws/h2c)
}

// --- Span vocabulary registry (design §6.2, §6.3, §6.6) ---
//
// proto is the single source of truth for the span vocabulary. wardex is a
// multi-language SDK; leaving the vocabulary in each SDK's own enums means the
// Node and Java adapters re-derive it from prose and drift, which is the same
// failure `crates/wardex-limits` exists to prevent for resource bounds.
//
// The three enums below are DECLARED and, in this schema version, deliberately
// UNREFERENCED by any message field except SpanLink.reason. `OperationName` and
// `ToolExecutionType` already travel as `Span.extra` keys
// (`gen_ai.operation.name`, `wardex.tool.execution_type`); adding a typed field
// alongside would double-carry the same value and force a precedence rule
// nobody has written. §6.6's purpose — stop other languages inventing the
// vocabulary — is met in full by a registry enum with no field.
//
// Every value name carries its enum's prefix. proto3 file-level enum values
// share the package namespace, so two unprefixed `UNSPECIFIED`s do not compile;
// `buf.yaml`'s `lint: use: BASIC` does NOT include ENUM_VALUE_PREFIX and will
// not warn. Value names and numbers are APPEND-ONLY: `buf breaking`'s FILE
// category locks both (ENUM_VALUE_SAME_NAME, ENUM_VALUE_NO_DELETE).

// The twelve span intents. CLOSED — a new operation costs a core PR, and a
// protocol variant is an attribute, never an operation (an MCP tool call is
// EXECUTE_TOOL with TOOL_EXECUTION_TYPE_IPC).
enum OperationName {
  OPERATION_NAME_UNSPECIFIED = 0;
  OPERATION_NAME_CHAT = 1;
  OPERATION_NAME_TEXT_COMPLETION = 2;
  OPERATION_NAME_EMBEDDINGS = 3;
  OPERATION_NAME_EXECUTE_TOOL = 4;
  OPERATION_NAME_CREATE_AGENT = 5;
  OPERATION_NAME_INVOKE_AGENT = 6;
  OPERATION_NAME_INVOKE_WORKFLOW = 7;
  OPERATION_NAME_GENERATE_CONTENT = 8;
  OPERATION_NAME_RETRIEVAL = 9;
  OPERATION_NAME_EXECUTE_STEP = 10;   // graph node / superstep / task
  OPERATION_NAME_HANDOFF = 11;        // agent transition; a marker span, not a container
  OPERATION_NAME_EVALUATE = 12;       // guardrail / judge / evaluator
}

// How a tool body actually ran. UNKNOWN is a legitimate value: wardex does not
// observe how a CLI's built-in tool executes, and asserting NETWORK for it was
// a guess that was simply wrong.
enum ToolExecutionType {
  TOOL_EXECUTION_TYPE_UNSPECIFIED = 0;
  TOOL_EXECUTION_TYPE_NETWORK = 1;
  TOOL_EXECUTION_TYPE_IN_PROCESS = 2;
  TOOL_EXECUTION_TYPE_IPC = 3;        // subprocess pipe / MCP stdio
  TOOL_EXECUTION_TYPE_UNKNOWN = 4;    // not observed — never guess
}

// Why one span points at another. A link is CAUSALITY; the parent edge is
// CONTAINMENT. Rendering a 5-hop handoff chain as 5 levels of nesting makes
// every duration in the flame graph a lie, so a handoff is a marker span plus
// LINK_REASON_HANDOFF_FROM to a SIBLING.
enum LinkReason {
  LINK_REASON_UNSPECIFIED = 0;
  LINK_REASON_TRIGGERED_BY = 1;   // a graph edge: the step that scheduled this one
  LINK_REASON_HANDOFF_FROM = 2;
  LINK_REASON_RESUMED_FROM = 3;   // checkpoint resume — a NEW trace, linked
  LINK_REASON_RETRIED_FROM = 4;
  LINK_REASON_CACHE_SOURCE = 5;
}

enum RetentionClass {
  RETENTION_CLASS_UNSPECIFIED = 0;
  RETENTION_CLASS_SUMMARY_ONLY = 1;   // metadata/metrics only. replay not possible
  RETENTION_CLASS_REPLAYABLE = 2;     // full captured I/O → cached replay possible
  RETENTION_CLASS_FORENSIC = 3;       // + headers/integrity/raw long-term retention (placeholder for P2 extension)
}

// --- Common Value Types ---

message AnyValue {
  oneof value {
    string string_value = 1;
    bool bool_value = 2;
    int64 int_value = 3;
    double double_value = 4;
    bytes bytes_value = 5;
    ArrayValue array_value = 6;
    KeyValueList kvlist_value = 7;
  }
}

message ArrayValue {
  repeated AnyValue values = 1;
}

message KeyValueList {
  repeated KeyValue values = 1;
}

message KeyValue {
  string key = 1;
  AnyValue value = 2;
}

message Status {
  StatusCode code = 1;
  string message = 2;
}
