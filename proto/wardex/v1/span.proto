syntax = "proto3";
package wardex.v1;

import "wardex/v1/common.proto";

option java_package = "io.wardex.proto.v1";
option java_multiple_files = true;

message Span {
  bytes trace_id = 1;
  bytes span_id = 2;
  bytes parent_span_id = 3;

  string name = 4;
  SpanKind kind = 5;
  fixed64 start_time_unix_nano = 6;
  fixed64 end_time_unix_nano = 7;

  Status status = 8;
  repeated KeyValue extra = 9;
  repeated SpanEvent events = 10;
  repeated SpanLink links = 11;

  int32 dropped_extra_count = 12;
  int32 dropped_events_count = 13;
  int32 dropped_links_count = 14;

  bytes input_data = 15;
  bytes output_data = 16;

  TransportAttributes transport = 17;

  // New fields for OTel alignment (gen_ai attributes are flattened into extra KeyValue — only structural/scalar fields go here)
  string error_type = 18;             // error.type (on failure)
  string server_address = 19;         // server.address
  int32 server_port = 20;             // server.port
  string workflow_name = 21;          // gen_ai.workflow.name
  CallSite call_site = 22;            // code.filepath/lineno/function
  ConversationContext conversation = 23;  // gen_ai.conversation.id + turn_index

  // Forensic layer (v2) — what/how much/how reliably was captured
  repeated CaptureSource capture_sources = 24;   // multiple allowed: e.g. (ADAPTER, SSL)
  CaptureIntegrity capture_integrity = 25;       // primary criterion for replay feasibility
  CorrelationInfo correlation = 26;              // evidence of matching between Adapters and Interceptors
}

message CallSite {
  string file = 1;
  int32 line = 2;
  string function = 3;
  string module = 4;
}

message ConversationContext {
  string conversation_id = 1;
  string session_id = 2;
  int32 turn_index = 3;
}

message CaptureIntegrity {
  // Tag 8 was `repeated string limitations`, an OPEN vocabulary. Retyping it in
  // place is not an option in either direction: packed enum and
  // length-delimited string share wire type 2, so old bytes would decode `Ok`
  // as one enum value per ASCII byte — data corruption with no error path.
  reserved 8;
  reserved "limitations";

  bool request_headers_captured = 1;
  bool request_body_captured = 2;
  bool response_headers_captured = 3;
  bool response_body_captured = 4;
  bool redacted = 5;
  bool truncated = 6;
  int32 dropped_chunk_count = 7;

  repeated Limitation limitation_codes = 9;

  // What the in-process masking replaced on this span, written by the masker
  // itself after every text field was scanned. `redacted` above says that
  // something was replaced; these say how much, by which rule, and under
  // which argument names, so a reader can tell why a value reads [SECRET]
  // without opening the SDK. All three stay empty on a span nothing was
  // replaced in.
  //
  // `redaction_count` counts replacements, not fields: two secrets in one
  // body count two.
  int32 redaction_count = 10;
  // Each rule that replaced at least one value, once, in enum order.
  repeated RedactionRule redaction_rules = 11;
  // The argument names a name rule matched (`api_key`, `X-Amz-Signature`), as
  // spelled in the payload, deduplicated in first-seen order and capped. The
  // names themselves pass through the value rules before they are recorded,
  // so a key that is itself an e-mail address does not ride out here.
  repeated string redaction_names = 12;
}

message CorrelationInfo {
  // Tag 6 was `string strategy`, which mixed two axes — how the parent was
  // derived, and which source observed the event — into one free-form field.
  // A scalar string retyped to an enum is a hard DecodeError that prost
  // propagates up the nesting, so one old span would fail an entire batch.
  reserved 6;
  reserved "strategy";

  string operation_id = 1;
  string request_id = 2;
  string attempt_id = 3;
  bytes active_span_id_at_capture = 4;
  float confidence = 5;                // 0.0~1.0

  ParentSource parent_source = 7;
}

message SpanEvent {
  string name = 1;
  fixed64 time_unix_nano = 2;
  repeated KeyValue attributes = 3;
}

message SpanLink {
  bytes trace_id = 1;
  bytes span_id = 2;
  repeated KeyValue attributes = 3;
  LinkReason reason = 4;  // why this span points at that one (causality, not containment)
}

// Every field here says either what the SDK observed or nothing. A field the
// SDK can fail to observe has explicit presence (`optional`), so "not
// observed" leaves it unset instead of shipping its zero value as a reading;
// an enum's unset is its `*_UNSPECIFIED` zero.
message TransportAttributes {
  // Tags 25 and 26 were `int32 chunk_index` and `bool is_final_chunk`. Nothing
  // ever filled them, so every span carried 0 and true: a claim about
  // streaming chunks that no one observed. Removed before any envelope was
  // stored, the last point a deletion is allowed; reserved so the numbers and
  // names never come back meaning something else.
  reserved 25, 26;
  reserved "chunk_index", "is_final_chunk";

  string connection_id = 1;
  Protocol protocol = 2;
  Direction direction = 3;
  TransportTiming timing = 4;
  // The size in bytes of each half as the SDK captured it: for HTTP the body
  // as it crossed the wire (content-coded, without chunk framing); for a
  // WebSocket session the payload bytes sent and received; for MCP stdio the
  // params and the result or error re-encoded as compact JSON, the form the
  // payload is captured in, which drops the server's whitespace and needless
  // `\u` escapes, so it is not the count of bytes on the pipe. Set only when
  // the half was captured whole. Unset: the body went past its capture limit,
  // so only a prefix was kept and its length is not the body's size (marked
  // `body_cap_exceeded` on HTTP/1; HTTP/2 marks the span truncated); an
  // HTTP/2 stream whose request half the stream table evicted before the
  // response arrived (marked `h2_request_evicted`); an HTTP/1 request the
  // parser had not finished reading when its response arrived; a WebSocket
  // direction whose frame parser stopped (marked `frame_parse_failed`); a
  // WebSocket session the SDK stopped following while it was still open (at
  // `wardex.close()`, marked `ws_no_close`, or when its connection table was
  // full, marked `connection_evicted`), which also leaves its length unset.
  optional int32 request_size = 5;
  optional int32 response_size = 6;

  HttpMeta http = 10;
  GrpcMeta grpc = 11;
  WebSocketMeta websocket = 12;
  McpMeta mcp = 13;
  SseMeta sse = 14;
  A2aMeta a2a = 15;

  string request_blob_ref = 20;
  string response_blob_ref = 21;

  // Unset means not observed. No producer in this SDK names a modality yet.
  Modality request_modality = 22;
  Modality response_modality = 23;

  // true: the response was a Server-Sent Events stream — it declared
  // `Content-Type: text/event-stream`, whether or not its body could be read,
  // or its body read as one. false: it did not declare one, and its whole
  // body was read as something else (JSON, or text with no event line).
  // Unset: it did not declare one and its body was not read as either: not
  // parsed (gRPC, a skipped or failed parse, a WebSocket session, stdio), cut
  // by its capture limit, in a `Content-Encoding` the SDK does not inflate
  // (it inflates one gzip or zlib layer), or not text (binary).
  optional bool is_streaming = 24;
  // Whether this transaction rode a pooled connection opened by an earlier
  // one. When true, `tcp_connect_ms` / `tls_handshake_ms` of 0 mean this
  // transaction opened nothing. false only where the SDK saw the connection
  // open; on HTTP/2, for stream 1, the one it was opened for. Unset where the
  // producer cannot tell either way: on a connection the SDK did not see open
  // (one opened before it started), the first HTTP/1 transaction it saw or
  // HTTP/2 stream 1; a WebSocket session; stdio.
  optional bool connection_reused = 27;
}

// Unset means the SDK did not measure that interval on this transaction —
// never that it took no time.
message TransportTiming {
  optional float tcp_connect_ms = 1;
  // From the first `do_handshake()` attempt to the one that completed it.
  optional float tls_handshake_ms = 2;
  // MCP stdio: the time until the response message was read.
  optional float ttfb_ms = 3;
  // A WebSocket session: its length, from its upgrade request to its end.
  optional float transfer_ms = 4;
  optional float ttft_ms = 5;  // time to the first response body byte (HTTP/1)
}

message HttpMeta {
  string method = 1;
  int32 status_code = 2;
  string url = 3;
}

message GrpcMeta {
  string service = 1;
  string method = 2;
  int32 stream_id = 3;
  int32 status_code = 4;
  string encoding = 5;
  string decoded_payload = 6;
}

message WebSocketMeta {
  int32 opcode = 1;
  string direction = 2;
}

message McpMeta {
  string rpc_method = 1;
  string rpc_id = 2;
}

message SseMeta {
  string event_type = 1;
}

message A2aMeta {
  string task_id = 1;
  string transport = 2;
}
