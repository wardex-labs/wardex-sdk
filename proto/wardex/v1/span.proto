syntax = "proto3";
package wardex.v1;

import "wardex/v1/common.proto";

option java_package = "io.wardex.proto.v1";
option java_multiple_files = true;

message Span {
  bytes trace_id = 1;
  bytes span_id = 2;
  bytes parent_span_id = 3;

  string name = 4;
  SpanKind kind = 5;
  fixed64 start_time_unix_nano = 6;
  fixed64 end_time_unix_nano = 7;

  Status status = 8;
  repeated KeyValue extra = 9;
  repeated SpanEvent events = 10;
  repeated SpanLink links = 11;

  int32 dropped_extra_count = 12;
  int32 dropped_events_count = 13;
  int32 dropped_links_count = 14;

  bytes input_data = 15;
  bytes output_data = 16;

  TransportAttributes transport = 17;

  // New fields for OTel alignment (gen_ai attributes are flattened into extra KeyValue — only structural/scalar fields go here)
  string error_type = 18;             // error.type (on failure)
  string server_address = 19;         // server.address
  int32 server_port = 20;             // server.port
  string workflow_name = 21;          // gen_ai.workflow.name
  CallSite call_site = 22;            // code.filepath/lineno/function
  ConversationContext conversation = 23;  // gen_ai.conversation.id + turn_index

  // Forensic layer (v2) — what/how much/how reliably was captured
  repeated CaptureSource capture_sources = 24;   // multiple allowed: e.g. (ADAPTER, SSL)
  CaptureIntegrity capture_integrity = 25;       // primary criterion for replay feasibility
  CorrelationInfo correlation = 26;              // evidence of matching between Adapters and Interceptors
}

message CallSite {
  string file = 1;
  int32 line = 2;
  string function = 3;
  string module = 4;
}

message ConversationContext {
  string conversation_id = 1;
  string session_id = 2;
  int32 turn_index = 3;
}

message CaptureIntegrity {
  bool request_headers_captured = 1;
  bool request_body_captured = 2;
  bool response_headers_captured = 3;
  bool response_body_captured = 4;
  bool redacted = 5;
  bool truncated = 6;
  int32 dropped_chunk_count = 7;
  repeated string limitations = 8;
}

message CorrelationInfo {
  string operation_id = 1;
  string request_id = 2;
  string attempt_id = 3;
  bytes active_span_id_at_capture = 4;
  float confidence = 5;                // 0.0~1.0
  string strategy = 6;                 // contextvar|header|socket|timing|manual
}

message SpanEvent {
  string name = 1;
  fixed64 time_unix_nano = 2;
  repeated KeyValue attributes = 3;
}

message SpanLink {
  bytes trace_id = 1;
  bytes span_id = 2;
  repeated KeyValue attributes = 3;
}

message TransportAttributes {
  string connection_id = 1;
  Protocol protocol = 2;
  Direction direction = 3;
  TransportTiming timing = 4;
  int32 request_size = 5;
  int32 response_size = 6;

  HttpMeta http = 10;
  GrpcMeta grpc = 11;
  WebSocketMeta websocket = 12;
  McpMeta mcp = 13;
  SseMeta sse = 14;
  A2aMeta a2a = 15;

  string request_blob_ref = 20;
  string response_blob_ref = 21;

  Modality request_modality = 22;
  Modality response_modality = 23;

  bool is_streaming = 24;
  int32 chunk_index = 25;
  bool is_final_chunk = 26;
  bool connection_reused = 27;  // whether the connection was reused via pooling (if true, connect/handshake=0 means "reused")
}

message TransportTiming {
  float tcp_connect_ms = 1;
  float tls_handshake_ms = 2;
  float ttfb_ms = 3;
  float transfer_ms = 4;
  float ttft_ms = 5;  // time-to-first-token (SSE streaming)
}

message HttpMeta {
  string method = 1;
  int32 status_code = 2;
  string url = 3;
}

message GrpcMeta {
  string service = 1;
  string method = 2;
  int32 stream_id = 3;
  int32 status_code = 4;
  string encoding = 5;
  string decoded_payload = 6;
}

message WebSocketMeta {
  int32 opcode = 1;
  string direction = 2;
}

message McpMeta {
  string rpc_method = 1;
  string rpc_id = 2;
}

message SseMeta {
  string event_type = 1;
}

message A2aMeta {
  string task_id = 1;
  string transport = 2;
}
