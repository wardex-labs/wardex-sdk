syntax = "proto3";
package wardex.v1;

import "wardex/v1/span.proto";
import "wardex/v1/state.proto";
import "wardex/v1/common.proto";

option java_package = "io.wardex.proto.v1";
option java_multiple_files = true;

message Envelope {
  EnvelopeHeader header = 1;
  repeated EnvelopeItem items = 2;
}

message EnvelopeHeader {
  string event_id = 1;
  // Field 2 was `string api_key`, retired before any envelope was ever
  // stored. A credential travels in the HTTP `Authorization` header of the
  // request that carries the envelope and is never written into a body: a
  // stored batch must be readable without holding a secret. The number and
  // the name are both reserved so neither can be reused with a new meaning.
  reserved 2;
  reserved "api_key";
  SdkInfo sdk = 3;
  fixed64 sent_at_unix_nano = 4;
  SessionStatus session_status = 5;
  RetentionClass retention_class = 6;  // retention grade for this batch trace (v2)
  ResourceInfo resource = 7;           // the host APPLICATION's identity (never the SDK's)
  // Which project this batch belongs to. STAMPED BY THE RECEIVER from the
  // API key it authenticated, before the envelope is stored: one key names
  // one project, so the receiver knows the answer and the sender is never
  // asked to claim it. The SDK sends this empty; a non-empty value from a
  // client is overwritten and counted, never trusted. Empty in a stored
  // envelope is a receiver bug, not a legal state.
  string project_id = 8;
}

// The exporting APPLICATION's identity — what OTLP resource attributes are
// built from. Deliberately separate from SdkInfo: SdkInfo describes the SDK
// doing the exporting (telemetry.sdk.*, the instrumentation scope), while this
// names the app whose spans these are. Empty fields mean "not configured";
// the OTLP mapping owns the fallback shaping (unknown_service:<language>).
message ResourceInfo {
  string service_name = 1;  // -> service.name
  string release = 2;       // -> service.version
  string environment = 3;   // -> deployment.environment.name
  // -> process.pid. The one per-PROCESS field here (the rest are per-app):
  // stamped live at drain time by the exporting process, so a fork parent
  // and its children are distinguishable at the backend — the attribution a
  // duplicate-or-legitimate judgement needs. 0 means "not stamped" and emits
  // no attribute; pid_max fits int32 on every supported platform.
  int32 process_pid = 4;
}

message SdkInfo {
  string name = 1;
  string version = 2;
  string python_version = 3;
  string os = 4;
  string arch = 5;
  repeated string adapters = 6;
  repeated string interceptors = 7;
  string otel_semconv_version = 8;  // single source: OTEL_SEMCONV_VERSION in the sending SDK
  string shell = 9;                 // "zsh", "bash" (static host metadata, v2 alignment #1)
}

message EnvelopeItem {
  EnvelopeItemHeader header = 1;
  oneof payload {
    Span span = 2;
    StateSnapshot state_snapshot = 3;
    ClientReport client_report = 4;
  }
}

message EnvelopeItemHeader {
  string type = 1;
  int32 length = 2;
}

message ClientReport {
  fixed64 timestamp_ns = 1;
  map<string, int32> discarded_events = 2;
  int32 failed_sends = 3;
  int32 queue_depth = 4;
  int64 uptime_ms = 5;
}
