[tool.uv.workspace]
members = ["sdks/python"]

[tool.uv]
# `uv sync` compiles the extension with the `panic-injection` cargo feature,
# which exposes `_panic_for_test()` for `sdks/python/tests/test_ffi_panic.py`
# (`bindings/python/src/shield.rs`). Scoped to this package so no third-party
# source build sees the argument. The release workflow builds with maturin
# directly and never reads this table, so a shipped wheel has no function
# whose purpose is to fail.
config-settings-package = { wardex-sdk = { build-args = "--features panic-injection" } }

# No dependency groups here on purpose: everything the suite imports lives in
# the `test` group of `sdks/python/pyproject.toml`, next to the tests that
# import it, so one `--group test` installs a complete test environment. A
# group split across two files is a group that cannot be named in one flag.

# `examples/` sits outside `sdks/python`, so without this block ruff would fall
# back to its built-in defaults there (88 columns, the E4/E7/E9/F rules only).
# One config, extended rather than copied: the settings stay next to the code
# that owns them, and an example is linted exactly like the source it shows.
[tool.ruff]
extend = "sdks/python/pyproject.toml"
