# cargo-deny: the wheel statically links every dependency into a binary that is
# shipped to customers, so every dependency's license, source and advisories are
# checked before it can ship. CI runs `check licenses bans sources` on every
# push and `check advisories` blocking on a weekly schedule and on the release
# gate (advisory data changes independently of the code, so a new entry must
# not turn an unrelated PR red, but must stop a wheel that links it).
# Every `ignore` entry below carries a reason.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Both entries are PyO3 0.22 advisories whose affected API this crate never
# calls (checked by grep: no `PyString::from_object`, no `PyCFunction::new_closure`).
# They go away with the PyO3 upgrade, which is tracked as its own change because
# it also carries the edition bump and the macro-expansion lint fallout.
ignore = [
    { id = "RUSTSEC-2025-0020", reason = "PyString::from_object is not called by this crate; fixed by the pending PyO3 upgrade" },
    { id = "RUSTSEC-2026-0177", reason = "PyCFunction::new_closure is not called by this crate; fixed by the pending PyO3 upgrade" },
]

[licenses]
# Permissive licenses only: the artifact is Apache-2.0 and links all of these.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unlicense",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
# Duplicates come from upstream proc macros (two `syn` majors, for example);
# `deny` would turn every upstream bump into a failure we cannot fix here.
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `path` dependencies have no registry version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
