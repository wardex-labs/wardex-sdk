[build-system]
requires      = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name            = "wardex-sdk"
version         = "0.6.0b1"
description     = "Open-source observability SDK for AI agents: model calls, tool calls and handoffs recorded as OpenTelemetry traces, with no code changes"
readme          = "README.md"
requires-python = ">=3.10"
license         = { text = "Apache-2.0" }
authors         = [{ name = "Wardex Labs" }]
maintainers     = [{ name = "Wardex Labs" }]
keywords        = ["observability", "ai-agents", "opentelemetry", "llm", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage   = "https://github.com/wardex-labs/wardex-sdk"
Repository = "https://github.com/wardex-labs/wardex-sdk"
Issues     = "https://github.com/wardex-labs/wardex-sdk/issues"

[tool.maturin]
manifest-path  = "../../bindings/python/Cargo.toml"
python-source  = "src"
module-name    = "wardex_sdk._wardex_native"
features       = ["pyo3/extension-module"]
# PEP 561: the wheel ships inline annotations, and type checkers ignore them
# without this marker. Declared for both formats so an sdist build keeps it.
include        = [{ path = "src/wardex_sdk/py.typed", format = ["sdist", "wheel"] }]

[dependency-groups]
# Everything `tests/` imports beyond the package itself, and nothing else. The
# floor check (`scripts/check-py310.sh`) installs exactly this group into a
# throwaway CPython 3.10, so a dependency missing here does not fail the run —
# it silently shrinks what the run covers.
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "syrupy>=4",
    "aiohttp>=3.9",
    # `anyio` and `hpack` arrive transitively (via httpx and h2 respectively),
    # but the suite imports both by name — a transitive edge is not a
    # declaration, and it breaks the day the intermediary drops it.
    "anyio>=4",
    "h2>=4.0",
    "hpack>=4.0",
    "httpx[http2]>=0.28.1",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "requests>=2.31",
    # test_conn_timing_uvloop.py `importorskip`s uvloop: absent, the uvloop
    # connect path is skipped rather than red.
    "uvloop>=0.17",
    "claude-agent-sdk>=0.2,<0.3",
    # Only 1.2.x is measured. The `invoke`->`stream` delegation direction and the
    # `pregel._runner` seam are unverified on 1.0.x/1.1.x and on anything newer.
    # Capped at the measured minor so CI tests exactly what the adapter's table of
    # tested versions (`_adapters/_measured.py`) claims; a host on another version
    # is told so once at `init()`.
    "langgraph>=1.2,<1.3",
    # The LangGraph adapter's tool seam patches `langgraph.prebuilt`, which ships
    # in this separately versioned distribution. Declared because the suite
    # measures it; the adapter's table of tested versions names it beside
    # langgraph, and a test holds every pin here to that table.
    "langgraph-prebuilt>=1.1,<1.2",
    # Only 0.22.x is measured (2026-09-05): the Responses request shape on
    # Runner.run / Runner.run_streamed, the `transfer_to_<agent>` handoff tool
    # name, the trace exporter's hardcoded `/v1/traces/ingest` endpoint and the
    # `httpx2` client it rides are all internals the surface probe cannot see —
    # the wire test plus this pin IS the floor. 0.23.x records wrong parents and
    # error types (2026-10-10), so it stays out of the pin and out of the table of
    # tested versions until the adapter is fixed for it.
    "openai-agents>=0.22,<0.23",
    "langchain-core>=0.3",
    # `langchain` (not just langchain-core) because `langchain.agents.create_agent`
    # is the non-deprecated successor to `create_react_agent`, and the tool seam's
    # coverage of it is a measured claim rather than an assumed one.
    "langchain>=1.0",
]
dev = [
    { include-group = "test" },
    # Pinned exactly. uv.lock is not committed, so a range lets CI resolve
    # whatever ruff is newest while a local venv keeps the one it installed,
    # and a formatter change (0.16 began formatting Python blocks inside
    # Markdown) then fails CI on a tree that passes locally. Raise it on
    # purpose, in a commit of its own, with the reformat it brings.
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "leaves_pending: this test deliberately leaves deferred-parse jobs pending (opts out of the conftest pending check)",
]

[tool.ruff]
line-length    = 100
target-version = "py310"
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
