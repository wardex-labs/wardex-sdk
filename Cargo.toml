[workspace]
resolver = "2"
members  = [
    "bindings/python",
    "crates/wardex-codec",
    "crates/wardex-core",
    "crates/wardex-limits",
    "crates/wardex-pipeline",
    "crates/wardex-protocol",
    "crates/wardex-replay",
]

[workspace.package]
edition       = "2021"
rust-version  = "1.83"
authors       = ["Wardex Team"]
license       = "Apache-2.0"

[workspace.dependencies]
# Core
bytes         = "1"
thiserror     = "2"
tracing       = "0.1"

# Protobuf
prost                 = "0.13"
prost-types           = "0.13"
prost-build           = "0.13"
protoc-bin-vendored   = "3"

# Compression
zstd          = "0.13"

# Encoding
base64        = "0.22"

# Python FFI
pyo3          = { version = "0.22", features = ["extension-module", "abi3-py310"] }

# HTTP/1 parsing
httparse      = "1"

# HTTP/2 HPACK decode
fluke-hpack   = "0.3"

# JSON serialization (semantic parsing) + response body decompression
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
flate2        = "1"

# PII masking — linear-time regex engine, no backtracking
regex         = "1"

# Test tooling — snapshot assertions
insta         = "1"

# Shared resource limits
wardex-limits = { path = "crates/wardex-limits" }
