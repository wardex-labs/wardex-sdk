[package]
name                   = "wardex-native-rs"
version                = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
publish.workspace      = true
description            = "PyO3 binding source for wardex-sdk (built by sdks/python via maturin)"

[lib]
name       = "_wardex_native"
crate-type = ["cdylib"]

[dependencies]
pyo3               = { workspace = true }
wardex-core        = { path = "../../crates/wardex-core" }
wardex-limits      = { workspace = true }

[features]
# Test-only: exposes `_panic_for_test()` so the FFI panic conversion can be
# exercised end to end, and makes a span named `__wardex_test_panic__` panic the
# PII masker so its fail-closed scrub can be (`crates/wardex-pipeline/src/pii/
# walk.rs`). The development build turns it on; release wheels never do (see
# `bindings/python/src/shield.rs`).
panic-injection = ["wardex-core/panic-injection"]

[lints]
workspace = true
