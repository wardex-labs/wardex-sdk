[package]
name                   = "wardex-native-rs"
version                = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
description            = "PyO3 binding source for wardex-sdk (built by sdks/python via maturin)"

[lib]
name       = "_wardex_native"
crate-type = ["cdylib"]

[dependencies]
pyo3               = { workspace = true }
wardex-core        = { path = "../../crates/wardex-core" }
wardex-limits      = { workspace = true }
